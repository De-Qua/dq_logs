# Run with docker compose up -d
services:
  dozzle:
    image: amir20/dozzle:latest
    container_name: dq_logs
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dozzle_data:/data
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
    networks:
      - default

networks:
  default:
    name: dequa_nw
    external: true
